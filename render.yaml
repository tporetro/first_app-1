databases:
  - name: storm-pipeline-db
    databaseName: storm_pipeline
    user: storm_pipeline
    plan: free

services:
  # ── Redis (Sidekiq job queue + cron state) ─────────────────────────────────
  - type: redis
    name: storm-pipeline-redis
    plan: free
    ipAllowList: []            # internal access only

  # ── Rails web process ──────────────────────────────────────────────────────
  - type: web
    name: storm-pipeline-web
    runtime: ruby
    plan: free
    buildCommand: |
      gem install bundler -v '~> 2.7'
      bundle install
      bundle exec rails assets:precompile
      bundle exec rails db:migrate
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "1"
      - key: RAILS_SERVE_STATIC_FILES
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: storm-pipeline-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: storm-pipeline-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      # ── Set these manually in the Render dashboard ─────────────────────────
      # - key: DASHBOARD_USERNAME
      # - key: DASHBOARD_PASSWORD
      # - key: ANTHROPIC_API_KEY
      # - key: CLAY_API_KEY
      # - key: SENDGRID_API_KEY   (or SMTP_* vars for ActionMailer)

  # ── Sidekiq worker process ─────────────────────────────────────────────────
  - type: worker
    name: storm-pipeline-worker
    runtime: ruby
    plan: starter
    buildCommand: |
      gem install bundler -v '~> 2.7'
      bundle install
    startCommand: bundle exec sidekiq -q pipeline -q default
    envVars:
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: storm-pipeline-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: storm-pipeline-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      # ── Same secrets as web process ────────────────────────────────────────
      # - key: ANTHROPIC_API_KEY
      # - key: CLAY_API_KEY
      # - key: SENDGRID_API_KEY
