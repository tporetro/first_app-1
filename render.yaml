databases:
  - name: leadpath-db
    plan: free
    databaseName: leadpath
    user: leadpath

services:
  - type: web
    name: leadpath
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn leadpath.wsgi:application"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: leadpath-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Required for property/entity research (see README) -- set these
      # in the Render dashboard after the first deploy, not here.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BING_SEARCH_API_KEY
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USER_AGENT
        sync: false
