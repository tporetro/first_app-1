<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JamAI — AI Music Studio</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="16" r="16" fill="url(#logoGrad)"/>
            <path d="M10 20V12l12 4-12 4z" fill="white"/>
            <defs>
              <linearGradient id="logoGrad" x1="0" y1="0" x2="32" y2="32">
                <stop offset="0%" stop-color="#7c3aed"/>
                <stop offset="100%" stop-color="#ec4899"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="logo-text">JamAI</span>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-view="studio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
          Studio
        </a>
        <a href="#" class="nav-item" data-view="library">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 18V5l12-2v13"/>
            <circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
          </svg>
          Library
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="track-count" id="trackCount">0 tracks</div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

      <!-- Studio View -->
      <section class="view" id="studioView">
        <div class="view-header">
          <h1>Create Music</h1>
          <p class="view-subtitle">Describe what you want to hear, and AI will compose it for you.</p>
        </div>

        <div class="studio-layout">
          <!-- Generation Form -->
          <div class="generate-card">
            <form id="generateForm">
              <div class="prompt-section">
                <label class="field-label">Describe your music</label>
                <textarea
                  id="promptInput"
                  class="prompt-input"
                  placeholder="An upbeat summer track with tropical vibes, warm synths, and punchy drums that makes you want to dance on the beach..."
                  rows="3"
                ></textarea>
              </div>

              <div class="params-grid">
                <div class="param-group">
                  <label class="field-label">Genre</label>
                  <div class="chip-group" id="genreGroup">
                    <button type="button" class="chip active" data-value="electronic">Electronic</button>
                    <button type="button" class="chip" data-value="pop">Pop</button>
                    <button type="button" class="chip" data-value="rock">Rock</button>
                    <button type="button" class="chip" data-value="jazz">Jazz</button>
                    <button type="button" class="chip" data-value="ambient">Ambient</button>
                    <button type="button" class="chip" data-value="hip-hop">Hip-Hop</button>
                    <button type="button" class="chip" data-value="lo-fi">Lo-Fi</button>
                    <button type="button" class="chip" data-value="classical">Classical</button>
                  </div>
                </div>

                <div class="param-group">
                  <label class="field-label">Mood</label>
                  <div class="chip-group" id="moodGroup">
                    <button type="button" class="chip active" data-value="energetic">Energetic</button>
                    <button type="button" class="chip" data-value="happy">Happy</button>
                    <button type="button" class="chip" data-value="calm">Calm</button>
                    <button type="button" class="chip" data-value="melancholic">Melancholic</button>
                    <button type="button" class="chip" data-value="epic">Epic</button>
                    <button type="button" class="chip" data-value="nostalgic">Nostalgic</button>
                    <button type="button" class="chip" data-value="dark">Dark</button>
                    <button type="button" class="chip" data-value="romantic">Romantic</button>
                  </div>
                </div>

                <div class="param-row">
                  <div class="param-group half">
                    <label class="field-label">Tempo</label>
                    <div class="chip-group" id="tempoGroup">
                      <button type="button" class="chip" data-value="slow">Slow</button>
                      <button type="button" class="chip active" data-value="medium">Medium</button>
                      <button type="button" class="chip" data-value="fast">Fast</button>
                    </div>
                  </div>

                  <div class="param-group half">
                    <label class="field-label">Duration</label>
                    <div class="chip-group" id="durationGroup">
                      <button type="button" class="chip" data-value="15">0:15</button>
                      <button type="button" class="chip active" data-value="30">0:30</button>
                      <button type="button" class="chip" data-value="60">1:00</button>
                    </div>
                  </div>
                </div>

                <div class="param-group">
                  <label class="field-label">Instruments</label>
                  <div class="chip-group" id="instrumentsGroup">
                    <button type="button" class="chip toggle" data-value="synth">Synth</button>
                    <button type="button" class="chip toggle" data-value="drums">Drums</button>
                    <button type="button" class="chip toggle" data-value="bass">Bass</button>
                    <button type="button" class="chip toggle" data-value="piano">Piano</button>
                    <button type="button" class="chip toggle" data-value="guitar">Guitar</button>
                    <button type="button" class="chip toggle" data-value="strings">Strings</button>
                  </div>
                </div>
              </div>

              <button type="submit" class="generate-btn" id="generateBtn">
                <span class="btn-content">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                  </svg>
                  Generate Music
                </span>
                <div class="btn-loader" id="btnLoader">
                  <div class="loader-bars">
                    <span></span><span></span><span></span><span></span><span></span>
                  </div>
                  <span>Composing...</span>
                </div>
              </button>
            </form>
          </div>

          <!-- Preview / Latest Track -->
          <div class="preview-card" id="previewCard">
            <div class="preview-empty" id="previewEmpty">
              <div class="empty-waveform">
                <div class="empty-bars">
                  <span></span><span></span><span></span><span></span><span></span>
                  <span></span><span></span><span></span><span></span><span></span>
                  <span></span><span></span><span></span><span></span><span></span>
                </div>
              </div>
              <p>Your generated track will appear here</p>
            </div>
            <div class="preview-player hidden" id="previewPlayer">
              <!-- Filled by JS -->
            </div>
          </div>
        </div>
      </section>

      <!-- Library View -->
      <section class="view hidden" id="libraryView">
        <div class="view-header">
          <h1>Your Library</h1>
          <p class="view-subtitle">All your AI-generated tracks in one place.</p>
        </div>

        <div class="library-toolbar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
            </svg>
            <input type="text" id="searchInput" placeholder="Search tracks..." />
          </div>
          <div class="filter-group">
            <select id="filterGenre" class="filter-select">
              <option value="">All genres</option>
              <option value="electronic">Electronic</option>
              <option value="pop">Pop</option>
              <option value="rock">Rock</option>
              <option value="jazz">Jazz</option>
              <option value="ambient">Ambient</option>
              <option value="hip-hop">Hip-Hop</option>
              <option value="lo-fi">Lo-Fi</option>
              <option value="classical">Classical</option>
            </select>
          </div>
        </div>

        <div class="tracks-grid" id="tracksGrid">
          <div class="tracks-empty hidden" id="tracksEmpty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M9 18V5l12-2v13"/>
              <circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
            </svg>
            <h3>No tracks yet</h3>
            <p>Head to the Studio to create your first AI track.</p>
            <button class="secondary-btn" onclick="switchView('studio')">Open Studio</button>
          </div>
        </div>
      </section>
    </main>

    <!-- Global Audio Player (bottom bar) -->
    <div class="player-bar" id="playerBar">
      <div class="player-info">
        <div class="player-waveform" id="playerWaveform">
          <canvas id="waveformCanvas" width="120" height="40"></canvas>
        </div>
        <div class="player-meta">
          <span class="player-title" id="playerTitle">—</span>
          <span class="player-tags" id="playerTags"></span>
        </div>
      </div>
      <div class="player-controls">
        <button class="ctrl-btn" id="playPauseBtn" title="Play/Pause">
          <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <svg class="icon-pause hidden" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
          </svg>
        </button>
        <button class="ctrl-btn" id="stopBtn" title="Stop">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
          </svg>
        </button>
      </div>
      <div class="player-right">
        <div class="progress-bar-wrap">
          <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="totalTime">0:00</span>
          </div>
        </div>
        <div class="volume-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
          <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.7" class="volume-slider">
        </div>
      </div>
    </div>
  </div>

  <!-- Track Card Template -->
  <template id="trackCardTemplate">
    <div class="track-card" data-id="">
      <div class="track-card-top">
        <div class="track-waveform-mini">
          <canvas class="mini-canvas" width="200" height="50"></canvas>
        </div>
        <div class="track-actions">
          <button class="icon-btn play-btn" title="Play">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"/>
            </svg>
          </button>
          <button class="icon-btn delete-btn" title="Delete">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="track-card-body">
        <h3 class="track-name"></h3>
        <p class="track-prompt"></p>
        <div class="track-chips">
          <span class="chip-tag genre-tag"></span>
          <span class="chip-tag mood-tag"></span>
          <span class="chip-tag tempo-tag"></span>
        </div>
        <div class="track-meta">
          <span class="track-duration"></span>
          <span class="track-plays"></span>
          <span class="track-date"></span>
        </div>
      </div>
    </div>
  </template>

  <script src="/js/synth.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
